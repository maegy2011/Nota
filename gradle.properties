android.useAndroidX=true
android.nonTransitiveRClass=true
# ─── Resource caps (2 vCPU / 3.8GB VPS shared with barakat services) ───
# Daemon heap 1g→512m, metaspace 512m→256m, workers 2→1: a build can never eat
# both CPUs or OOM the server. Hard-enforced at OS level by build-safe.sh
# (systemd MemoryMax=1.2G + CPUQuota=100%). After editing: ./gradlew --stop
# CI/Release build heap — GitHub runners have 7GB RAM, R8 needs ~5-6g (OOM fix for CI; local 3.8GB builds should use -Dorg.gradle.jvmargs override)
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon.idletimeout=600000
# ذاكرة مترجمة Kotlin (28 سبتمبر 2026): 256m كانت أقل من اللازم فيفشل التجميع بـ
# "Not enough memory" — الحل JSPM واحد: التجميع داخل عملية Gradle نفسها بدل JVM منفصل
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kapt.use.k2=true
