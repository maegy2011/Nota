name: build-release

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Release variant to build (mock or play)"
        required: true
        default: "mock"
        type: choice
        options:
          - mock
          - play
  push:
    tags:
      - "nota-v*"

env:
  GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # NOTE: `secrets` context is not allowed in steps[*].if (GitHub rejects
    # the workflow at parse time with HTTP 422 on dispatch). Copy the
    # secret presence into env here, then gate the keystore step on env.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.NOTA_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # R8 OOM mitigation: runners have limited disk/RAM — free space first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk* /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h

      # R8 + Kotlin need headroom beyond the 7GB runner RAM
      - name: Create 10GB swapfile
        run: |
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Signing secrets check — values stay in GitHub Secrets, never in code.
      # Expected secrets: NOTA_KEYSTORE_BASE64, NOTA_KEYSTORE_PASSWORD, NOTA_KEY_PASSWORD.
      # If the keystore secret is absent, the release build will fail at signing
      # configuration time (by design — debug signing fallback is a later decision).
      - name: Check signing secrets presence (no values printed)
        run: |
          test -n "${{ secrets.NOTA_KEYSTORE_BASE64 }}" && echo "NOTA_KEYSTORE_BASE64: set" || echo "NOTA_KEYSTORE_BASE64: MISSING"
          test -n "${{ secrets.NOTA_KEYSTORE_PASSWORD }}" && echo "NOTA_KEYSTORE_PASSWORD: set" || echo "NOTA_KEYSTORE_PASSWORD: MISSING"
          test -n "${{ secrets.NOTA_KEY_PASSWORD }}" && echo "NOTA_KEY_PASSWORD: set" || echo "NOTA_KEY_PASSWORD: MISSING"

      - name: Restore release keystore from secret
        if: ${{ env.HAS_RELEASE_KEYSTORE != '' }}
        run: |
          mkdir -p ~/.config/nota
          echo "${{ secrets.NOTA_KEYSTORE_BASE64 }}" | base64 -d > ~/.config/nota/nota-release.keystore
          chmod 600 ~/.config/nota/nota-release.keystore
          ls -l ~/.config/nota/nota-release.keystore

      - name: Assemble single release variant
        env:
          NOTA_KEYSTORE_PASSWORD: ${{ secrets.NOTA_KEYSTORE_PASSWORD }}
          NOTA_KEY_PASSWORD: ${{ secrets.NOTA_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VARIANT="${{ inputs.variant }}"
          else
            VARIANT="mock"
          fi
          if [ "$VARIANT" = "play" ]; then
            ./gradlew assemblePlayRelease --stacktrace
          else
            ./gradlew assembleMockRelease --stacktrace
          fi

      - name: Upload release APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: nota-release-apk
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 7
